<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">

</head>

<body>
    <script type="module" src="../global.js"></script>
    <script src="main.js" type="module"></script>

    <h1>Meta</h1>

    <p>This page contains stats about the code of this website</p>

    <!-- <div id="slider-container">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100">
            <time id="commit-time"></time>
        </label>
    </div> -->

    <h2>Summary</h2>
    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story">
            <h2>Evolution over time</h2>
        </div>
        <div id="scatter-plot">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines edited</dt>
        <dd id="commit-lines"></dd>

    </dl>

    <div id="scrolly-2">
        <div id="files-plot">
            <dl id="files"></dl>
        </div>
        <div id="files-story"></div>
    </div>

</body>

</html>
